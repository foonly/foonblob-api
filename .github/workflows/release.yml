name: Foonblob API build

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -race ./...
      - name: Check version.txt matches tag
        run: |
          test "v$(cat version.txt)" = "${GITHUB_REF_NAME}" || {
            echo "version.txt ($(cat version.txt)) does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      - name: Build
        run: make build
      - name: Checksum
        run: cd bin && sha256sum foonblob-api > foonblob-api.sha256
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "bin/foonblob-api,bin/foonblob-api.sha256"
